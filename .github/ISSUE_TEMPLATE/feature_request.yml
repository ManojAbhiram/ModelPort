name: Feature or provider request
description: Describe a concrete integration need, evidence, and boundaries.
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        Do not share keys, account details, private prompts, recordings or media.
        No live or paid call is needed to request a feature. Provider marketing and
        OpenAI compatibility alone do not prove operation support.
        Security disclosures belong in the private route described by SECURITY.md.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no credentials or private prompts/audio/media.
          required: true
  - type: textarea
    id: use_case
    attributes:
      label: Product use case
      description: What task should a developer be able to complete? Use a synthetic example.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Name exact operations and constraints. Distinguish native, compatible and planned behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Official sources
      description: For provider requests, link official API/authentication/capability docs and record the review date.
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy, security and billing implications
      description: Note new hosts, credential scopes, uploads, persistence, jobs or approval requirements.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and verification
      description: Mention existing options and how the change could be tested without provider credentials.
