name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7; verified 2026-11-14
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7; verified 2026-11-14
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check, unit-test and build
        run: npm run check
      - name: Refresh declared dependency licenses and inspect SDK packaging
        run: |
          npm run licenses:report
          npm run package:preview
          git diff --exit-code -- docs/DEPENDENCY-LICENSES.md apps/web/public/THIRD_PARTY_NOTICES.txt packages/core/LICENSE
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test browser flows with mocked API responses
        run: npm run test:e2e
